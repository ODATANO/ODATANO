name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Gate 1: full test pipeline (cds:types, typecheck, lint, unit/integration
  # suites) — reuses the same workflow that guards main.
  verify:
    uses: ./.github/workflows/test.yaml
    secrets: inherit
    permissions:
      contents: read

  # Gate 2: the npm package itself must build and be clean — `npm ci` runs the
  # `prepare` build (catches TS5058-class packaging breaks), the production
  # audit blocks known-vulnerable releases, and pack --dry-run validates the
  # files allowlist. Publishing to npm stays a MANUAL step by policy.
  package-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --dry-run

  build-and-release:
    needs: [verify, package-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Heal the recurring `v.1.10.0` typo (leading dot after the v) and
          # fail fast on anything that is still not a valid image tag, instead
          # of dying later in buildx with "invalid reference format".
          VERSION=${VERSION#.}
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '${GITHUB_REF#refs/tags/}' does not yield a valid version (got '$VERSION'); use vMAJOR.MINOR.PATCH"
            exit 1
          fi
          # A pre-release (2.0.0-rc.1, 1.9.0-beta.2, ...) must NOT overwrite the
          # `latest` Docker tag and must be flagged as a GitHub pre-release.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "git_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Verify tag matches package.json and mta.yaml
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::tag version '$VERSION' does not match package.json version '$PKG_VERSION' — retag the correct commit or bump package.json first"
            exit 1
          fi
          MTA_VERSION=$(sed -n 's/^version:[[:space:]]*//p' mta.yaml | head -1)
          if [ "$MTA_VERSION" != "$VERSION" ]; then
            echo "::error::tag version '$VERSION' does not match mta.yaml version '$MTA_VERSION' — keep mta.yaml in sync with package.json"
            exit 1
          fi
      
      - name: Set repository owner to lowercase
        id: repo
        run: |
          echo "repository_owner_lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # `latest` only for stable releases — an RC must never replace the
          # stable container tag (empty list entries are ignored by the action).
          tags: |
            ghcr.io/${{ steps.repo.outputs.repository_owner_lowercase }}/odatano:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && format('ghcr.io/{0}/odatano:latest', steps.repo.outputs.repository_owner_lowercase) || '' }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            VCS_REF=${{ steps.version.outputs.git_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Export Docker image
        run: |
          docker pull ghcr.io/${{ steps.repo.outputs.repository_owner_lowercase }}/odatano:${{ steps.version.outputs.version }}
          docker save ghcr.io/${{ steps.repo.outputs.repository_owner_lowercase }}/odatano:${{ steps.version.outputs.version }} -o odatano-${{ steps.version.outputs.version }}.tar
          gzip odatano-${{ steps.version.outputs.version }}.tar
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: odatano-${{ steps.version.outputs.version }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
