name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Gate 1: the full test pipeline, the same workflow that guards main.
  verify:
    uses: ./.github/workflows/test.yaml
    secrets: inherit
    permissions:
      contents: read

  # Gate 2: the npm package must build, pass the production audit, pack cleanly and work
  # when installed into an empty CAP project. Publishing to npm stays a manual step.
  package-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/audit-tree.mjs app/router --omit=dev
      - run: node scripts/audit-tree.mjs app/wallet
      - run: npm pack --dry-run
      - run: node scripts/smoke-consumer.mjs
      # the login package that ships reads ODATANO_TRUST_PROXY
      - run: node scripts/check-login-package.mjs
      # the BTP module as mta.yaml builds it: loads on CAP 10, installs from its lockfile, npm audit
      - run: node scripts/build/verify-btp-module.mjs

  build-and-release:
    needs: [verify, package-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Only vMAJOR.MINOR.PATCH[-pre] is a release tag; publish-guard.mjs accepts nothing else,
          # so a typo tag such as v.1.10.0 fails here instead of pushing images nobody can publish.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '${GITHUB_REF#refs/tags/}' does not yield a valid version (got '$VERSION'); use vMAJOR.MINOR.PATCH"
            exit 1
          fi
          # A pre-release (2.0.0-rc.1, 1.9.0-beta.2, ...) must NOT overwrite the
          # `latest` Docker tag and must be flagged as a GitHub pre-release.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "git_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Verify tag matches package.json and mta.yaml
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::tag version '$VERSION' does not match package.json version '$PKG_VERSION'. Retag the correct commit or bump package.json first"
            exit 1
          fi
          MTA_VERSION=$(sed -n 's/^version:[[:space:]]*//p' mta.yaml | head -1)
          if [ "$MTA_VERSION" != "$VERSION" ]; then
            echo "::error::tag version '$VERSION' does not match mta.yaml version '$MTA_VERSION'. Keep mta.yaml in sync with package.json"
            exit 1
          fi
      
      - name: Set repository owner to lowercase
        id: repo
        run: |
          echo "repository_owner_lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
      
      - name: Build Docker image for the audit
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: odatano:audit
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            VCS_REF=${{ steps.version.outputs.git_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image adds the DB adapters to the production tree, so its own tree is audited before the push.
      - name: Audit the image's dependency tree
        run: docker run --rm --entrypoint npm odatano:audit audit --audit-level=high

      # The image is started before it is pushed: probes, credentials, a restart on the same volume.
      - name: Start the image and probe it
        run: node scripts/smoke-image.mjs odatano:audit

      # The image that passed the audit and the smoke is the one pushed, not a second build.
      - name: Push the tested Docker image
        env:
          IMAGE: ghcr.io/${{ steps.repo.outputs.repository_owner_lowercase }}/odatano
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          docker tag odatano:audit "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          # `latest` only for stable releases, so an RC never replaces the stable tag.
          if [ "$PRERELEASE" = "false" ]; then
            docker tag odatano:audit "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

      - name: Export Docker image
        run: |
          docker save ghcr.io/${{ steps.repo.outputs.repository_owner_lowercase }}/odatano:${{ steps.version.outputs.version }} -o odatano-${{ steps.version.outputs.version }}.tar
          gzip odatano-${{ steps.version.outputs.version }}.tar
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: odatano-${{ steps.version.outputs.version }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
