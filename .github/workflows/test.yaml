name: ODATANO Tests

on:
  workflow_call:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # ==========================================
      # Cardano Node DB Cache (Sync-Workflow)
      # ==========================================
      - name: Get current date for cache key
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restore Cardano Node DB Cache
        id: cache-cardano
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/cardano-preview-db
          key: cardano-node-preview-${{ steps.date.outputs.date }}
          restore-keys: |
            cardano-node-preview-

      - name: Install dependencies
        run: npm ci

      - name: Generate CDS types
        run: npm run cds:types
      
      - name: Type check
        run: npm run typecheck
        
      - name: Lint codebase
        run: npm run lint  

      - name: Deploy database
        run: npm run db:deploy

      # ==========================================
      # Start Cardano Node + Ogmios (nur wenn Cache vorhanden)
      # ==========================================
      - name: Setup Docker volumes and network
        if: steps.cache-cardano.outputs.cache-hit == 'true'
        run: |
          docker volume create cardano-preview-ipc || true
          docker network create odatano-network || true
          
      - name: Start Cardano Node
        if: steps.cache-cardano.outputs.cache-hit == 'true'
        run: |
          docker run -d \
            --name cardano-node-preview \
            --network odatano-network \
            -v ${{ github.workspace }}/config/preview/cardano-node:/config:ro \
            -v ${{ github.workspace }}/cardano-preview-db:/data \
            -v cardano-preview-ipc:/ipc \
            ghcr.io/intersectmbo/cardano-node:10.1.3 \
            run \
            --config /config/config.json \
            --topology /config/topology.json \
            --database-path /data/db \
            --socket-path /ipc/node.socket
          echo "Waiting for node socket..."
          sleep 30
          
      - name: Start Ogmios
        if: steps.cache-cardano.outputs.cache-hit == 'true'
        run: |
          docker run -d \
            --name ogmios-preview \
            --network odatano-network \
            -p 1337:1337 \
            -v cardano-preview-ipc:/ipc:ro \
            -v ${{ github.workspace }}/config/preview/cardano-node:/config:ro \
            cardanosolutions/ogmios:v6.14.0 \
            --node-socket /ipc/node.socket \
            --node-config /config/config.json \
            --host 0.0.0.0 \
            --port 1337

      - name: Wait for Ogmios to be ready
        id: ogmios-ready
        if: steps.cache-cardano.outputs.cache-hit == 'true'
        continue-on-error: true
        run: |
          timeout 180 bash -c 'until curl -f http://localhost:1337/health > /dev/null 2>&1; do echo "Waiting for Ogmios..."; sleep 5; done'
          echo "Ogmios is ready!"
          echo "ready=true" >> $GITHUB_OUTPUT

      - name: Cache Status Info
        run: |
          if [ "${{ steps.cache-cardano.outputs.cache-hit }}" != "true" ]; then
            echo "⚠️ No Cardano Node cache found - Ogmios tests will be skipped"
            echo "💡 Run the 'Network Synchronization' workflow first to create a cache"
          elif [ "${{ steps.ogmios-ready.outputs.ready }}" != "true" ]; then
            echo "⚠️ Ogmios not ready - Ogmios tests will be skipped"
          else
            echo "✅ Ogmios is ready - all tests will run"
          fi

      # ==========================================
      # Run Tests
      # ==========================================
      - name: Run tests with coverage (Koios + Blockfrost)
        env:
          NODE_ENV: test
          NETWORK: 'preview'
          BACKENDS: 'koios,blockfrost'
          BLOCKFROST_KEY: ${{ secrets.BLOCKFROST_API_KEY }}
          PRIMARY_TIMEOUT_MS: 8000
          FALLBACK_TIMEOUT_MS: 8000
          INDEX_TTL_MS: 60000
        run: npm run test:ci:coverage

      - name: Run Ogmios integration tests
        if: steps.ogmios-ready.outputs.ready == 'true'
        env:
          NODE_ENV: test
          NETWORK: 'preview'
          BACKENDS: 'ogmios'
          OGMIOS_WS_URL: 'ws://localhost:1337'
        run: npm test -- test/integration/core-ogmios.test.ts

      # ==========================================
      # Save Cardano Node DB Cache
      # ==========================================
      - name: Stop Cardano Node gracefully
        if: always()
        run: |
          docker stop ogmios-preview || true
          docker stop cardano-node-preview || true
        continue-on-error: true

      - name: Save Cardano Node DB Cache
        if: always() && steps.cache-cardano.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/cardano-preview-db
          key: cardano-node-preview-${{ steps.date.outputs.date }}

      # ==========================================
      # Cleanup & Upload Coverage
      # ==========================================
      - name: Cleanup Docker containers
        if: always()
        run: docker rm -f ogmios-preview cardano-node-preview || true
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: node-${{ matrix.node-version }}
          name: node-${{ matrix.node-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
