name: ODATANO Tests

on:
  workflow_call:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read

concurrency:
  group: odatano-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # ==========================================
      # Cardano Node DB Cache (Sync-Workflow)
      # ==========================================
      - name: Restore Cardano Node DB Cache
        id: cache-cardano
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/db-preview
          key: cardano-node-ogmios-preview
          restore-keys: |
            cardano-node-ogmios-preview

      - name: Cache info
        run: |
          if [ "${{ steps.cache-cardano.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Cache found: ${{ steps.cache-cardano.outputs.cache-matched-key }}"
          else
            echo "⚠️ No cache found - will skip Ogmios tests"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate CDS types
        run: npm run cds:types
      
      - name: Type check
        run: npm run typecheck
        
      - name: Lint codebase
        run: npm run lint  

      - name: Deploy database
        run: npm run db:deploy

      # ==========================================
      # Start Cardano Node + Ogmios (nur wenn Cache vorhanden)
      # ==========================================
      - name: Verify config files exist
        if: steps.cache-cardano.outputs.cache-hit == 'true'
        run: |
          echo "Checking config files..."
          ls -la ${{ github.workspace }}/config/preview/cardano-node/
          
      # ==========================================
      # Start Cardano Node + Ogmios with GitHub Action
      # ==========================================
      - name: Start Cardano Node and Ogmios
        id: cardano-ogmios-sync
        if: steps.cache-cardano.outputs.cache-hit == 'true'
        uses: CardanoSolutions/gh-action-cardano-node-ogmios-docker-sync@5bbec3e542f6cbd775c22f74316f978003afcecf
        continue-on-error: true
        timeout-minutes: 60
        with:
          db-dir: ${{ runner.temp }}/db-preview
          network: preview
          version: latest
          synchronization-level: 1

      - name: Check Ogmios availability
        id: ogmios-ready
        if: steps.cache-cardano.outputs.cache-hit == 'true'
        continue-on-error: true
        run: |
          MAX_RETRIES=10
          RETRY_DELAY=3
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES: Checking Ogmios health..."
            if curl -f http://localhost:1337/health > /dev/null 2>&1; then
              echo "✅ Ogmios is ready!"
              echo "ready=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Not ready yet, waiting ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
          
          echo "⚠️ Ogmios not available after $MAX_RETRIES attempts"
          echo "ready=false" >> $GITHUB_OUTPUT

      - name: Cache Status Info
        run: |
          if [ "${{ steps.cache-cardano.outputs.cache-hit }}" != "true" ]; then
            echo "⚠️ No Cardano Node cache found - running tests with Koios + Blockfrost only"
            echo "💡 Run the 'Network Synchronization' workflow first to create a cache"
          elif [ "${{ steps.ogmios-ready.outputs.ready }}" == "true" ]; then
            echo "✅ Ogmios ready - running all tests with Koios + Blockfrost + Ogmios"
          else
            echo "⚠️ Ogmios not ready - running tests with Koios + Blockfrost only"
          fi

      # ==========================================
      # Run Tests
      # ==========================================
      - name: Run tests with coverage (Koios + Blockfrost only)
        if: steps.ogmios-ready.outputs.ready != 'true'
        env:
          NODE_ENV: test
          NETWORK: 'preview'
          BACKENDS: 'koios,blockfrost'
          BLOCKFROST_KEY: ${{ secrets.BLOCKFROST_API_KEY }}
          PRIMARY_TIMEOUT_MS: 8000
          FALLBACK_TIMEOUT_MS: 8000
          INDEX_TTL_MS: 60000
        run: npm run test:ci:coverage

      - name: Run tests with coverage (All Backends including Ogmios)
        if: steps.ogmios-ready.outputs.ready == 'true'
        env:
          NODE_ENV: test
          NETWORK: 'preview'
          BACKENDS: 'koios,blockfrost,ogmios'
          BLOCKFROST_KEY: ${{ secrets.BLOCKFROST_API_KEY }}
          OGMIOS_WS_URL: 'ws://localhost:1337'
          PRIMARY_TIMEOUT_MS: 8000
          FALLBACK_TIMEOUT_MS: 8000
          INDEX_TTL_MS: 60000
        run: npm run test:ci:coverage

      # ==========================================
      # Save Cardano Node DB Cache
      # ==========================================
      - name: Stop Cardano Node gracefully
        if: always()
        run: |
          docker stop ogmios-preview || true
          docker stop cardano-node-preview || true
        continue-on-error: true

      # ==========================================
      # Cleanup & Upload Coverage
      # ==========================================
      # Note: Cache is only saved by the sync job (ogmios-sync.yaml)
      # This job only restores the cache to avoid conflicts
      - name: Cleanup Docker containers
        if: always()
        run: |
          docker stop $(docker ps -q) || true
          docker rm -f $(docker ps -aq) || true
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: node-${{ matrix.node-version }}
          name: node-${{ matrix.node-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
