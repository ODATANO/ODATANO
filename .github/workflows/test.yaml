name: ODATANO Tests

on:
  workflow_call:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read

concurrency:
  group: odatano-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # ==========================================
      # Cardano Node DB Cache (Sync-Workflow)
      # ==========================================
      - name: Restore Cardano Node DB Cache
        id: cache-cardano
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/db-preview
          key: cardano-node-ogmios-preview
          restore-keys: |
            cardano-node-ogmios-preview

      - name: Cache info
        run: |
          if [ "${{ steps.cache-cardano.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Cache found: ${{ steps.cache-cardano.outputs.cache-matched-key }}"
          else
            echo "⚠️ No cache found - will skip Ogmios tests"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate CDS types
        run: npm run cds:types
      
      - name: Type check
        run: npm run typecheck
        
      - name: Lint codebase
        run: npm run lint  

      - name: Deploy database
        run: npm run db:deploy

      # ==========================================
      # Start Cardano Node + Ogmios (if cache exists)
      # ==========================================
      - name: Start Cardano Node + Ogmios containers
        if: steps.cache-cardano.outputs.cache-hit == 'true'
        run: |
          CONFDIR=${{ github.workspace }}/config/preview
          
          # Start Cardano Node
          docker run -d --name cardano-node-preview \
            -v ${{ runner.temp }}/db-preview:/db \
            -v ${{ runner.temp }}/ipc:/ipc \
            -v $CONFDIR/cardano-node:/config \
            ghcr.io/intersectmbo/cardano-node:11.0.1 run \
              --config /config/config.json \
              --database-path /db \
              --socket-path /ipc/node.socket \
              --topology /config/topology.json
          
          # Start Ogmios
          docker run -d --name ogmios-preview \
            -p 1337:1337 \
            -v ${{ runner.temp }}/ipc:/ipc \
            -v $CONFDIR:/config \
            ghcr.io/odatano/ogmios:v6.14.0.2 \
              --host 0.0.0.0 \
              --node-socket /ipc/node.socket \
              --node-config /config/cardano-node/config.json
          
          echo "Waiting for containers to start..."
          sleep 10
          docker ps

      - name: Wait for Ogmios sync
        id: ogmios-ready
        if: steps.cache-cardano.outputs.cache-hit == 'true'
        continue-on-error: true
        run: |
          echo "Waiting for Ogmios to connect + sync (max 25 minutes)..."
          MAX_WAIT=1500
          ELAPSED=0
          # 0.99 is reported the instant the node opens the socket (it just
          # echoes the CACHED tip, which is ~13 days behind live). Passing at
          # 0.99 lets the node do its heavy multi-day catch-up DURING the test
          # run, starving Ogmios while jest hammers the CPU → "Premature close"
          # at backend init → whole Ogmios suite 503s. Requiring 0.999 (~1 day
          # behind) forces the bulk catch-up to finish HERE — in the gate step,
          # with no jest competing — so tests run against a near-tip, lightly
          # loaded node where Ogmios stays responsive.
          THRESHOLD=0.999

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            HEALTH=$(curl -s --max-time 5 http://localhost:1337/health 2>/dev/null || echo "{}")
            # Ogmios answers /health even while DISCONNECTED from the node (then
            # connectionStatus="disconnected", networkSynchronization=null). A
            # reachable endpoint therefore does NOT mean usable -- we must require
            # an ACTIVE node connection AND near-tip sync, otherwise the gate
            # false-positives and the Ogmios suite runs against a dead backend.
            CONN=$(sed -n 's/.*"connectionStatus":"\([^"]*\)".*/\1/p' <<< "$HEALTH")
            SYNC=$(sed -n 's/.*"networkSynchronization":\([0-9.]*\).*/\1/p' <<< "$HEALTH")
            [ -z "$SYNC" ] && SYNC=0

            if [ "$CONN" = "connected" ]; then
              PERCENT=$(echo "$SYNC * 100" | bc -l 2>/dev/null | cut -c1-5 || echo "0")
              echo "Connected — sync progress: ${PERCENT}%"

              if [ "$(echo "$SYNC >= $THRESHOLD" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
                echo "✅ Ogmios connected and synced to tip!"
                echo "ready=true" >> $GITHUB_OUTPUT
                exit 0
              fi
            else
              echo "Waiting for Ogmios to connect to node (status=${CONN:-none})..."
            fi

            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

          echo "⚠️ Ogmios not connected+synced after ${MAX_WAIT}s — Ogmios suite will be skipped"
          echo "ready=false" >> $GITHUB_OUTPUT

      - name: Cache Status Info
        run: |
          if [ "${{ steps.cache-cardano.outputs.cache-hit }}" != "true" ]; then
            echo "⚠️ No Cardano Node cache found - running tests with Koios + Blockfrost only"
            echo "💡 Run the 'Network Synchronization' workflow first to create a cache"
          elif [ "${{ steps.ogmios-ready.outputs.ready }}" == "true" ]; then
            echo "✅ Ogmios ready - running all tests with Koios + Blockfrost + Ogmios"
          else
            echo "⚠️ Ogmios not ready - running tests with Koios + Blockfrost only"
          fi

      # ==========================================
      # Run Tests
      # ==========================================
      - name: Run tests with coverage (Koios + Blockfrost only)
        if: steps.ogmios-ready.outputs.ready != 'true'
        env:
          NODE_ENV: test
          CDS_ENV: test
          LOG_LEVEL: 'error'
          NETWORK: 'preview'
          BACKENDS: 'koios,blockfrost'  #Ogmios excluded here (tests will skip Ogmios tests)
          BLOCKFROST_API_KEY: ${{ secrets.BLOCKFROST_API_KEY }}
          TX_BUILDERS: 'buildooor,csl'
          PRIMARY_TIMEOUT_MS: 15000
          FALLBACK_TIMEOUT_MS: 15000
          INDEX_TTL_MS: 60000
        run: npm run test:ci:coverage

      - name: Run tests with coverage (All Backends including Ogmios)
        if: steps.ogmios-ready.outputs.ready == 'true'
        env:
          NODE_ENV: test
          CDS_ENV: test
          LOG_LEVEL: 'error'
          NETWORK: 'preview'
          BACKENDS: 'koios,blockfrost'
          BLOCKFROST_API_KEY: ${{ secrets.BLOCKFROST_API_KEY }}
          OGMIOS_URL: 'ws://localhost:1337'
          TX_BUILDERS: 'buildooor,csl'
          PRIMARY_TIMEOUT_MS: 15000
          FALLBACK_TIMEOUT_MS: 15000
          INDEX_TTL_MS: 60000
        run: npm run test:coverage

      # On failure, capture node/ogmios state so we can tell a transient
      # catch-up hiccup ("Premature close", recovered by init-retry) apart from
      # a real crash/OOM (RestartCount>0 / OOMKilled=true / "Killed" in logs).
      - name: Dump Cardano Node + Ogmios diagnostics on failure
        if: failure()
        continue-on-error: true
        run: |
          for c in cardano-node-preview ogmios-preview; do
            echo "===== docker inspect: $c ====="
            docker inspect -f 'Running={{.State.Running}} RestartCount={{.RestartCount}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Status={{.State.Status}}' "$c" 2>&1 || true
            echo "===== last 120 log lines: $c ====="
            docker logs --tail 120 "$c" 2>&1 || true
          done
          echo "===== /health at failure time ====="
          curl -s --max-time 5 http://localhost:1337/health || echo "(no response)"

      # ==========================================
      # Save Cardano Node DB Cache
      # ==========================================
      - name: Stop Cardano Node gracefully
        if: always()
        run: |
          docker stop ogmios-preview || true
          docker stop cardano-node-preview || true
        continue-on-error: true

      # ==========================================
      # Cleanup & Upload Coverage
      # ==========================================
      # Note: Cache is only saved by the sync job (ogmios-sync.yaml)
      # This job only restores the cache to avoid conflicts
      - name: Cleanup Docker containers
        if: always()
        run: |
          docker stop $(docker ps -q) || true
          docker rm -f $(docker ps -aq) || true
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: node-${{ matrix.node-version }}
          name: node-${{ matrix.node-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
