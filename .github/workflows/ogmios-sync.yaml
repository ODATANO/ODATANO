name: Ogmios & Cardano Node Sync

on:
  schedule:
    - cron: '00 08,22 * * *'
  workflow_dispatch:
    inputs:
      synchronization-level:
        description: 'Desired % synchronization level. Between 0 and 1.'
        required: false
        default: '1'
        type: number

jobs:
  sync_and_cache:
    strategy:
      matrix:
        network: [ preview ]
        version: [ latest ]

    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/db-${{ matrix.network }}
        key: cardano-node-ogmios-${{ matrix.network }}
        restore-keys: |
          cardano-node-ogmios-${{ matrix.network }}

    - uses: CardanoSolutions/gh-action-cardano-node-ogmios-docker-sync@5bbec3e542f6cbd775c22f74316f978003afcecf
      with:
        db-dir: ${{ runner.temp }}/db-${{ matrix.network }}
        network: ${{ matrix.network }}
        version: ${{ matrix.version }}
        synchronization-level: ${{ inputs.synchronization-level || 1 }}

    - name: prune node db (keep recent data only)
      shell: bash
      working-directory: ${{ runner.temp }}/db-${{ matrix.network }}
      run: |
        sudo chown -R $(whoami):$(whoami) immutable
        # Count total chunks
        TOTAL_CHUNKS=$(ls immutable/*.chunk 2>/dev/null | wc -l)
        echo "Total chunks found: $TOTAL_CHUNKS"
        
        # Delete only the oldest 200 chunks (keep most of the chain)
        if [ $TOTAL_CHUNKS -gt 300 ]; then
          CHUNKS_TO_DELETE=200
          echo "Deleting oldest $CHUNKS_TO_DELETE chunks to save space..."
          ls immutable/*.chunk | sort | head -n $CHUNKS_TO_DELETE | xargs -r rm -f
          echo "✅ Pruned $CHUNKS_TO_DELETE old chunks, kept $(($TOTAL_CHUNKS - $CHUNKS_TO_DELETE))"
        else
          echo "⚠️ Only $TOTAL_CHUNKS chunks, skipping pruning to preserve sync data"
        fi

    - uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/db-${{ matrix.network }}
        key: cardano-node-ogmios-${{ matrix.network }}
