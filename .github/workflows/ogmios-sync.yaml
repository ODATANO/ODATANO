name: Ogmios & Cardano Node Sync

on:
  schedule:
    - cron: '00 08,22 * * *'
  workflow_dispatch:
    inputs:
      synchronization-level:
        description: 'Desired % synchronization level. Between 0 and 1.'
        required: false
        default: '0.999'
        type: number

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  sync_and_cache:
    strategy:
      matrix:
        network: [ preview ]
        ogmios_version: [ v6.14.0.2 ]
        cardano_node_version: [ 11.0.1 ]

    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    # ---------------------------------------------------------------------------
    # Build & push the standalone Ogmios image (also consumed by test.yaml).
    #
    # IntersectMBO does not publish a Docker image for the v6.14.0.x patch
    # releases, so we layer the prebuilt Ogmios binary (release artifact) into
    # the ogmios repo's own "ogmios" Docker stage and push it to GHCR.
    # Idempotent: skipped once the tag exists.
    # ---------------------------------------------------------------------------

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Resolve Ogmios image ref
      id: img
      shell: bash
      run: |
        owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "ogmios_ref=ghcr.io/${owner}/ogmios:${{ matrix.ogmios_version }}" >> "$GITHUB_OUTPUT"

    - name: Check whether Ogmios image exists
      id: check
      shell: bash
      run: |
        if docker manifest inspect "${{ steps.img.outputs.ogmios_ref }}" > /dev/null 2>&1; then
          echo "ogmios=true" >> "$GITHUB_OUTPUT"
        else
          echo "ogmios=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout Ogmios source
      if: steps.check.outputs.ogmios == 'false'
      uses: actions/checkout@v4
      with:
        repository: IntersectMBO/ogmios
        ref: ${{ matrix.ogmios_version }}
        path: ogmios-src
        # server/config is a git submodule (cardano-foundation/cardano-configurations).
        submodules: true

    - name: Fetch prebuilt Ogmios binary
      if: steps.check.outputs.ogmios == 'false'
      shell: bash
      working-directory: ogmios-src
      run: |
        mkdir -p server
        curl -sSL \
          "https://github.com/IntersectMBO/ogmios/releases/download/${{ matrix.ogmios_version }}/ogmios-${{ matrix.ogmios_version }}-x86_64-linux.tar.gz" \
          -o ogmios.tar.gz
        # Tarball layout is bin/ogmios -> extract into server/ to get server/bin/ogmios
        tar -xzf ogmios.tar.gz -C server
        chmod +x server/bin/ogmios

    - name: Build & push standalone Ogmios image
      if: steps.check.outputs.ogmios == 'false'
      shell: bash
      working-directory: ogmios-src
      run: |
        # The Dockerfile's first stage ("ogmios") is the standalone bridge image.
        docker build --target ogmios -t "${{ steps.img.outputs.ogmios_ref }}" .
        docker push "${{ steps.img.outputs.ogmios_ref }}"

    # ---------------------------------------------------------------------------
    # Sync the node DB. We run cardano-node + ogmios exactly like test.yaml does,
    # using the repo's node-11-compatible config (EnableP2P:false, legacy
    # topology, no peer-snapshot). The combined cardanosolutions image is NOT
    # used: its baked cardano-configurations predates node 11's peer-snapshot
    # schema and fails to start.
    # ---------------------------------------------------------------------------

    - name: Restore Cardano Node DB cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/db-${{ matrix.network }}
        key: cardano-node-ogmios-${{ matrix.network }}
        restore-keys: |
          cardano-node-ogmios-${{ matrix.network }}

    - name: Start Cardano Node + Ogmios
      shell: bash
      run: |
        CONFDIR="${{ github.workspace }}/config/${{ matrix.network }}"
        mkdir -p "${{ runner.temp }}/db-${{ matrix.network }}" "${{ runner.temp }}/ipc"

        docker run -d --name cardano-node \
          -v ${{ runner.temp }}/db-${{ matrix.network }}:/db \
          -v ${{ runner.temp }}/ipc:/ipc \
          -v "$CONFDIR/cardano-node:/config" \
          ghcr.io/intersectmbo/cardano-node:${{ matrix.cardano_node_version }} run \
            --config /config/config.json \
            --database-path /db \
            --socket-path /ipc/node.socket \
            --topology /config/topology.json

        docker run -d --name ogmios \
          -p 1337:1337 \
          -v ${{ runner.temp }}/ipc:/ipc \
          -v "$CONFDIR:/config" \
          ${{ steps.img.outputs.ogmios_ref }} \
            --host 0.0.0.0 \
            --node-socket /ipc/node.socket \
            --node-config /config/cardano-node/config.json

        docker ps

    - name: Synchronize
      id: sync
      shell: bash
      env:
        # Sync closer to tip before caching so test.yaml restores a fresher DB
        # (less catch-up = Ogmios stays responsive under the test job's CPU load).
        THRESHOLD: ${{ inputs.synchronization-level || '0.999' }}
      run: |
        URL="http://localhost:1337/health"
        # A "dirty" restored DB (e.g. after an ungraceful prior stop) makes the
        # node do a FULL ImmutableDB re-validation before it opens the node
        # socket -- ~70-90 min for the preview chain. Ogmios only answers /health
        # once that socket exists, so the warmup window must comfortably exceed a
        # full revalidation, otherwise we kill a perfectly healthy startup early.
        # The per-iteration container-alive check below still catches real
        # crashes within seconds, so a generous backstop costs nothing.
        WARMUP=7200      # node must answer /health within 2h (covers full re-validation)
        BUDGET=19800     # sync for at most 5h30m, then save partial progress
        start="$(date +%s)"
        warmup_deadline=$(( start + WARMUP ))
        sync_deadline=$(( start + BUDGET ))

        # Wait until Ogmios is connected to the node. Ogmios /health returns
        # 202 (Accepted) while still syncing and 200 (OK) once near tip, so both
        # codes mean "up & connected" -- only keep waiting on 5xx/connection errors.
        # Fail fast (with logs) if either container dies, and tail the node log
        # each iteration so startup progress / crashes are visible immediately.
        until printf '%s' "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$URL" 2>/dev/null)" | grep -qE '^(200|202)$'; do
          for c in cardano-node ogmios; do
            running="$(docker inspect -f '{{.State.Running}}' "$c" 2>/dev/null || echo missing)"
            if [ "$running" != "true" ]; then
              echo "::error::container '$c' is not running (state=$running)"
              echo "----- cardano-node logs -----"; docker logs --tail 200 cardano-node || true
              echo "----- ogmios logs -----";       docker logs --tail 120 ogmios || true
              exit 1
            fi
          done

          if (( $(date +%s) >= warmup_deadline )); then
            echo "::error::Ogmios not healthy after ${WARMUP}s"
            echo "----- cardano-node logs -----"; docker logs --tail 200 cardano-node || true
            echo "----- ogmios logs -----";       docker logs --tail 120 ogmios || true
            exit 1
          fi

          h="$(curl -sS --max-time 5 "$URL" 2>/dev/null || true)"
          tip="$(sed -n 's/.*"lastKnownTip":{"slot":\([0-9]*\).*/\1/p' <<< "$h")"
          ns="$(sed -n 's/.*"networkSynchronization":\([0-9.]*\).*/\1/p' <<< "$h")"
          # Before Ogmios connects, /health is empty -- surface the node's own
          # ImmutableDB validation/replay progress so the long warmup is visible.
          # grep exits 1 when the last log line isn't a progress line; under the
          # default `set -eo pipefail` shell that would abort the whole step, so
          # swallow it with `|| true`.
          node_prog="$(docker logs --tail 1 cardano-node 2>&1 | grep -oE '(Validat|Replay)[a-z]* .*Progress: [0-9.]+%' | tail -1 || true)"
          echo "waiting for ogmios... tip slot: ${tip:-?}  sync: ${ns:-0}  node: ${node_prog:-starting}"
          sleep 10
        done
        echo "Ogmios is up. Target synchronization: ${THRESHOLD}"

        level="0"
        while true; do
          health="$(curl -sS --max-time 10 "$URL" || echo '{}')"
          level="$(sed -n 's/.*"networkSynchronization":\([0-9.]*\).*/\1/p' <<< "$health")"
          era="$(sed -n 's/.*"currentEra":"\([^"]*\)".*/\1/p' <<< "$health")"
          [ -z "$level" ] && level="0"

          pct="$(awk "BEGIN{printf \"%.2f\", $level*100}")"
          echo "[$(date -u +%H:%M:%S)] sync: ${pct}%  era: ${era:-?}"

          if awk "BEGIN{exit !($level >= $THRESHOLD)}"; then
            echo "Reached target synchronization (${pct}%)."
            break
          fi
          if (( $(date +%s) >= sync_deadline )); then
            echo "Time budget reached at ${pct}% — saving partial progress for the next run."
            break
          fi
          sleep 30
        done

        echo "level=${level}" >> "$GITHUB_OUTPUT"

    - name: Stop containers
      if: always()
      shell: bash
      run: |
        # Order matters: stop the Ogmios client first, then shut the node down
        # GRACEFULLY. cardano-node needs well beyond Docker's default 10s SIGTERM
        # grace period to write its clean-shutdown marker + a ledger snapshot.
        # A premature SIGKILL leaves the ImmutableDB "dirty", which forces a full
        # chunk re-validation (and lost snapshot) on the next restore.
        docker stop -t 30 ogmios || true
        echo "Gracefully stopping cardano-node (up to 10 min for snapshot + clean marker)..."
        docker stop -t 600 cardano-node || true
        # Confirm the node closed its DB cleanly before we cache it.
        docker logs --tail 30 cardano-node 2>&1 | grep -iE "Closed db|ShutdownRequested|Closing" || \
          echo "::warning::No clean-shutdown marker found in node logs — cache may trigger re-validation"
        docker rm ogmios cardano-node || true

    # NOTE: Do NOT prune the ImmutableDB by deleting front *.chunk files. The
    # node's ImmutableDB must be contiguous from genesis; removing leading chunks
    # (while their .primary/.secondary indexes and the ledger snapshot remain)
    # corrupts the DB and the node fails to start on the next restore. The full
    # preview DB is well within the GitHub Actions cache budget, so we cache it
    # whole. If size ever becomes a problem, shrink via snapshot count, never by
    # deleting immutable chunks.

    # Save whatever progress we made (success() is implied -> only when the
    # sync step didn't hard-fail), so subsequent runs resume from here.
    - name: Delete old cache
      shell: bash
      run: gh cache delete "cardano-node-ogmios-${{ matrix.network }}" || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Save Cardano Node DB cache
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/db-${{ matrix.network }}
        key: cardano-node-ogmios-${{ matrix.network }}
