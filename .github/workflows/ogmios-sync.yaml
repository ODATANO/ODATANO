name: Ogmios & Cardano Node Sync

on:
  schedule:
    - cron: '00 08,22 * * *'
  workflow_dispatch:
    inputs:
      synchronization-level:
        description: 'Desired % synchronization level. Between 0 and 1.'
        required: false
        default: '0.985'
        type: number

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  sync_and_cache:
    strategy:
      matrix:
        network: [ preview ]
        ogmios_version: [ v6.14.0.2 ]
        cardano_node_version: [ 11.0.1 ]

    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    # ---------------------------------------------------------------------------
    # Build the combined cardano-node + ogmios image ourselves.
    #
    # The published cardanosolutions/cardano-node-ogmios image lags behind: its
    # newest tag bundles cardano-node 10.5.3, which no longer fully syncs preview.
    # IntersectMBO does not publish a combined image. So we layer the prebuilt
    # Ogmios binary (release artifact) on top of cardano-node 11.0.1 using the
    # ogmios repo's own Dockerfile, and push the result to GHCR.
    #
    # Idempotent: if the tag already exists in GHCR the build steps are skipped,
    # so the scheduled runs go straight to pull + sync.
    # ---------------------------------------------------------------------------

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Resolve image refs
      id: img
      shell: bash
      run: |
        owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        repo="ghcr.io/${owner}/cardano-node-ogmios"
        echo "repo=${repo}" >> "$GITHUB_OUTPUT"
        echo "ref=${repo}:${{ matrix.ogmios_version }}_${{ matrix.cardano_node_version }}-${{ matrix.network }}" >> "$GITHUB_OUTPUT"
        # Standalone Ogmios image consumed by test.yaml (not network-specific).
        echo "ogmios_ref=ghcr.io/${owner}/ogmios:${{ matrix.ogmios_version }}" >> "$GITHUB_OUTPUT"

    - name: Check whether images already exist
      id: check
      shell: bash
      run: |
        if docker manifest inspect "${{ steps.img.outputs.ref }}" > /dev/null 2>&1; then
          echo "combined=true" >> "$GITHUB_OUTPUT"
        else
          echo "combined=false" >> "$GITHUB_OUTPUT"
        fi
        if docker manifest inspect "${{ steps.img.outputs.ogmios_ref }}" > /dev/null 2>&1; then
          echo "ogmios=true" >> "$GITHUB_OUTPUT"
        else
          echo "ogmios=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout Ogmios source
      if: steps.check.outputs.combined == 'false' || steps.check.outputs.ogmios == 'false'
      uses: actions/checkout@v4
      with:
        repository: IntersectMBO/ogmios
        ref: ${{ matrix.ogmios_version }}
        path: ogmios-src

    - name: Fetch prebuilt Ogmios binary
      if: steps.check.outputs.combined == 'false' || steps.check.outputs.ogmios == 'false'
      shell: bash
      working-directory: ogmios-src
      run: |
        mkdir -p server
        curl -sSL \
          "https://github.com/IntersectMBO/ogmios/releases/download/${{ matrix.ogmios_version }}/ogmios-${{ matrix.ogmios_version }}-x86_64-linux.tar.gz" \
          -o ogmios.tar.gz
        # Tarball layout is bin/ogmios -> extract into server/ to get server/bin/ogmios
        tar -xzf ogmios.tar.gz -C server
        chmod +x server/bin/ogmios

    - name: Build & push combined cardano-node + ogmios image
      if: steps.check.outputs.combined == 'false'
      shell: bash
      working-directory: ogmios-src
      run: |
        docker build \
          --build-arg CARDANO_NODE_IMAGE=ghcr.io/intersectmbo/cardano-node:${{ matrix.cardano_node_version }} \
          --build-arg NETWORK=${{ matrix.network }} \
          -t "${{ steps.img.outputs.ref }}" .
        docker push "${{ steps.img.outputs.ref }}"

    - name: Build & push standalone Ogmios image
      if: steps.check.outputs.ogmios == 'false'
      shell: bash
      working-directory: ogmios-src
      run: |
        # The Dockerfile's first stage ("ogmios") is the standalone bridge image;
        # consumed by test.yaml to run Ogmios against the synced node.
        docker build --target ogmios -t "${{ steps.img.outputs.ogmios_ref }}" .
        docker push "${{ steps.img.outputs.ogmios_ref }}"

    # ---------------------------------------------------------------------------
    # Sync the node DB using our freshly built image.
    # ---------------------------------------------------------------------------

    - uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/db-${{ matrix.network }}
        key: cardano-node-ogmios-${{ matrix.network }}
        restore-keys: |
          cardano-node-ogmios-${{ matrix.network }}

    - uses: CardanoSolutions/gh-action-cardano-node-ogmios-docker-sync@5bbec3e542f6cbd775c22f74316f978003afcecf
      id: sync
      with:
        repository: ${{ steps.img.outputs.repo }}
        db-dir: ${{ runner.temp }}/db-${{ matrix.network }}
        network: ${{ matrix.network }}
        version: ${{ matrix.ogmios_version }}_${{ matrix.cardano_node_version }}
        synchronization-level: ${{ inputs.synchronization-level || 0.985 }}
        warm-up-timeout: 900

    - name: prune node db
      # Prune if sync is at or above 98% to keep cache size manageable
      if: ${{ steps.sync.outputs.synchronization-level-initial >= 0.98 }}
      shell: bash
      working-directory: ${{ runner.temp }}/db-${{ matrix.network }}
      run: |
        sudo chown -R $(whoami):$(whoami) immutable
        ls immutable/*.chunk | sort | head -n -2500 | xargs -r rm -f --

    - name: Delete old cache
      run: gh cache delete "cardano-node-ogmios-${{ matrix.network }}" || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/db-${{ matrix.network }}
        key: cardano-node-ogmios-${{ matrix.network }}
