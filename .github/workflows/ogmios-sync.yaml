name: Ogmios & Cardano Node Sync

on:
  schedule:
    - cron: '00 08,22 * * *'
  workflow_dispatch:
    inputs:
      synchronization-level:
        description: 'Desired % synchronization level. Between 0 and 1.'
        required: false
        default: '1'
        type: number

jobs:
  sync_and_cache:
    strategy:
      matrix:
        network: [ preview ]
        version: [ latest ]

    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/db-${{ matrix.network }}
        key: cardano-node-ogmios-${{ matrix.network }}
        restore-keys: |
          cardano-node-ogmios-${{ matrix.network }}

    - uses: CardanoSolutions/gh-action-cardano-node-ogmios-docker-sync@5bbec3e542f6cbd775c22f74316f978003afcecf
      id: sync
      with:
        db-dir: ${{ runner.temp }}/db-${{ matrix.network }}
        network: ${{ matrix.network }}
        version: ${{ matrix.version }}
        synchronization-level: ${{ inputs.synchronization-level || 1 }}

    - name: prune node db
      # Only prune if sync was already at or above 99.5% before this run
      if: ${{ steps.sync.outputs.synchronization-level-initial >= 0.995 }}
      shell: bash
      working-directory: ${{ runner.temp }}/db-${{ matrix.network }}
      run: |
        sudo chown -R $(whoami):$(whoami) immutable
        ls immutable/*.chunk | sort | head -n -2500 | xargs -r rm -f --

    - uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/db-${{ matrix.network }}
        key: cardano-node-ogmios-${{ matrix.network }}
