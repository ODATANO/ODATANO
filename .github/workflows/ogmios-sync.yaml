name: Ogmios & Cardano Node Sync

on:
  schedule:
    - cron: '00 08,22 * * *'
  workflow_dispatch:
    inputs:
      synchronization-level:
        description: 'Desired % synchronization level. Between 0 and 1.'
        required: false
        default: '0.999'
        type: number

permissions:
  actions: write
  contents: read

# Never run two syncs at once (e.g. a manual dispatch overlapping the cron):
# parallel runs would each cold-sync and race on the cache. The newer run
# waits until the running one finishes instead of being cancelled.
concurrency:
  group: ogmios-sync
  cancel-in-progress: false

jobs:
  sync_and_cache:
    strategy:
      matrix:
        network: [ preview ]
        ogmios_version: [ v7.0.0 ]
        cardano_node_version: [ 11.0.1 ]

    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    # Standalone Ogmios image from CardanoSolutions (the same one test.yaml runs).
    - name: Resolve Ogmios image ref
      id: img
      shell: bash
      run: echo "ogmios_ref=cardanosolutions/ogmios:${{ matrix.ogmios_version }}" >> "$GITHUB_OUTPUT"

    # Node and Ogmios run as separate images with the repo's config, as in test.yaml.
    # The combined cardanosolutions image fails to start with node 11.

    # Caches are immutable per key. Save under a unique key each run and restore the newest by prefix.
    # Deleting and re-saving one fixed key races with cache reservations and can lose the DB.
    - name: Restore Cardano Node DB cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/db-${{ matrix.network }}
        key: cardano-node-ogmios-${{ matrix.network }}-${{ github.run_id }}
        restore-keys: |
          cardano-node-ogmios-${{ matrix.network }}-
          cardano-node-ogmios-${{ matrix.network }}

    - name: Start Cardano Node + Ogmios
      shell: bash
      run: |
        CONFDIR="${{ github.workspace }}/config/${{ matrix.network }}"
        mkdir -p "${{ runner.temp }}/db-${{ matrix.network }}" "${{ runner.temp }}/ipc"

        docker run -d --name cardano-node \
          -v ${{ runner.temp }}/db-${{ matrix.network }}:/db \
          -v ${{ runner.temp }}/ipc:/ipc \
          -v "$CONFDIR/cardano-node:/config" \
          ghcr.io/intersectmbo/cardano-node:${{ matrix.cardano_node_version }} run \
            --config /config/config.json \
            --database-path /db \
            --socket-path /ipc/node.socket \
            --topology /config/topology.json

        docker run -d --name ogmios \
          -p 1337:1337 \
          -v ${{ runner.temp }}/ipc:/ipc \
          -v "$CONFDIR:/config" \
          ${{ steps.img.outputs.ogmios_ref }} \
            --host 0.0.0.0 \
            --node-socket /ipc/node.socket \
            --node-config /config/cardano-node/config.json

        docker ps

    - name: Synchronize
      id: sync
      shell: bash
      env:
        # Sync close to the tip, so test.yaml restores a fresh DB and Ogmios stays responsive there.
        THRESHOLD: ${{ inputs.synchronization-level || '0.999' }}
      run: |
        URL="http://localhost:1337/health"
        # A dirty restored DB makes the node re-validate for 70 to 90 minutes before /health answers.
        # The warmup must exceed that. The container check below still catches real crashes at once.
        WARMUP=7200      # node must answer /health within 2h (covers full re-validation)
        BUDGET=19800     # sync for at most 5h30m, then save partial progress
        start="$(date +%s)"
        warmup_deadline=$(( start + WARMUP ))
        sync_deadline=$(( start + BUDGET ))

        # Wait until Ogmios is connected. /health returns 202 while syncing and 200 near the tip.
        # Fail fast with logs if either container dies.
        until printf '%s' "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$URL" 2>/dev/null)" | grep -qE '^(200|202)$'; do
          for c in cardano-node ogmios; do
            running="$(docker inspect -f '{{.State.Running}}' "$c" 2>/dev/null || echo missing)"
            if [ "$running" != "true" ]; then
              echo "::error::container '$c' is not running (state=$running)"
              echo "----- cardano-node logs -----"; docker logs --tail 200 cardano-node || true
              echo "----- ogmios logs -----";       docker logs --tail 120 ogmios || true
              exit 1
            fi
          done

          if (( $(date +%s) >= warmup_deadline )); then
            echo "::error::Ogmios not healthy after ${WARMUP}s"
            echo "----- cardano-node logs -----"; docker logs --tail 200 cardano-node || true
            echo "----- ogmios logs -----";       docker logs --tail 120 ogmios || true
            exit 1
          fi

          h="$(curl -sS --max-time 5 "$URL" 2>/dev/null || true)"
          tip="$(sed -n 's/.*"lastKnownTip":{"slot":\([0-9]*\).*/\1/p' <<< "$h")"
          ns="$(sed -n 's/.*"networkSynchronization":\([0-9.]*\).*/\1/p' <<< "$h")"
          # Show the node's own replay progress while /health is still empty.
          # `|| true` keeps a non-matching grep from aborting the step under pipefail.
          node_prog="$(docker logs --tail 1 cardano-node 2>&1 | grep -oE '(Validat|Replay)[a-z]* .*Progress: [0-9.]+%' | tail -1 || true)"
          echo "waiting for ogmios... tip slot: ${tip:-?}  sync: ${ns:-0}  node: ${node_prog:-starting}"
          sleep 10
        done
        echo "Ogmios is up. Target synchronization: ${THRESHOLD}"

        level="0"
        while true; do
          health="$(curl -sS --max-time 10 "$URL" || echo '{}')"
          level="$(sed -n 's/.*"networkSynchronization":\([0-9.]*\).*/\1/p' <<< "$health")"
          era="$(sed -n 's/.*"currentEra":"\([^"]*\)".*/\1/p' <<< "$health")"
          [ -z "$level" ] && level="0"

          pct="$(awk "BEGIN{printf \"%.2f\", $level*100}")"
          echo "[$(date -u +%H:%M:%S)] sync: ${pct}%  era: ${era:-?}"

          if awk "BEGIN{exit !($level >= $THRESHOLD)}"; then
            echo "Reached target synchronization (${pct}%)."
            break
          fi
          if (( $(date +%s) >= sync_deadline )); then
            echo "Time budget reached at ${pct}%, saving partial progress for the next run."
            break
          fi
          sleep 30
        done

        echo "level=${level}" >> "$GITHUB_OUTPUT"

    - name: Stop containers
      if: always()
      shell: bash
      run: |
        # Stop Ogmios first, then give the node far more than 10s to write its snapshot and clean marker.
        # A premature SIGKILL leaves the DB dirty and forces a full re-validation on the next restore.
        docker stop -t 30 ogmios || true
        echo "Gracefully stopping cardano-node (up to 10 min for snapshot + clean marker)..."
        docker stop -t 600 cardano-node || true
        # Confirm the node closed its DB cleanly before we cache it.
        docker logs --tail 30 cardano-node 2>&1 | grep -iE "Closed db|ShutdownRequested|Closing" || \
          echo "::warning::No clean-shutdown marker found in node logs, cache may trigger re-validation"
        docker rm ogmios cardano-node || true

    # Never prune the ImmutableDB by deleting leading chunk files. It must be contiguous from genesis,
    # or the node fails to start. To save space, reduce the snapshot count instead.

    # Save whatever progress we made (success() is implied -> only when the
    # sync step didn't hard-fail), so subsequent runs resume from here.
    - name: Save Cardano Node DB cache
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/db-${{ matrix.network }}
        key: cardano-node-ogmios-${{ matrix.network }}-${{ github.run_id }}

    # Prune AFTER a successful save, keeping only the cache we just wrote.
    # If the save above failed, the previous cache is still in place and the
    # next run resumes from it instead of genesis.
    - name: Prune older DB caches
      shell: bash
      run: |
        gh cache list --key "cardano-node-ogmios-${{ matrix.network }}" --json id,key \
          --jq '.[] | select(.key != "cardano-node-ogmios-${{ matrix.network }}-${{ github.run_id }}") | .id' \
          | while read -r id; do gh cache delete "$id" || true; done
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
