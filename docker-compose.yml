version: '3.8'

services:
  odatano:
    # ===========================================
    # For DEVELOPMENT: Uncomment to build from source
    # ===========================================
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.1.0}
        BUILD_DATE: ${BUILD_DATE}
        VCS_REF: ${VCS_REF}
    
    # ===========================================
    # Image configuration
    # ===========================================
    # For DEVELOPMENT (after building): odatano:0.1.0
    # For PRODUCTION: ghcr.io/odatano/odatano:0.1.0
    image: odatano:${VERSION:-0.1.0}
    container_name: odatano-service
    ports:
      - "4004:4004"
    environment:
      # Cardano network configuration (mainnet, preview, preprod)
      - NETWORK=preview
      
      # Backend configuration (comma-separated: blockfrost,koios or single)
      - BACKENDS=blockfrost,koios
      
      # Blockfrost API credentials
      # Get your API key from https://blockfrost.io
      - BLOCKFROST_KEY=${BLOCKFROST_KEY:-your-blockfrost-api-key-here}
      
      # Koios API credentials (optional)
      - KOIOS_API_KEY=${KOIOS_API_KEY:-}
      
      # Timeout configuration (in milliseconds)
      - PRIMARY_TIMEOUT_MS=8000
      - FALLBACK_TIMEOUT_MS=10000
      - INDEX_TTL_MS=600000
      
      # Logging
      - LOG_LEVEL=info
      
      # Application settings
      - NODE_ENV=development
      - PORT=4004
      
      # Disable XSUAA (not needed for this service)
      - CDS_REQUIRES_AUTH=mocked
      
    # No volumes needed - SQLite DB is ephemeral in container
    # Data is fetched fresh from blockchain APIs on each query
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4004/$metadata"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - odatano-network

networks:
  odatano-network:
    driver: bridge
