specVersion: "4.0"
metadata:
  name: odatanoview.signingflow
type: application
framework:
  name: SAPUI5
  version: "1.144.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
builder:
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateVersionInfo
      configuration:
        archiveName: odatanosigningflow
        additionalFiles:
          - xs-app.json
