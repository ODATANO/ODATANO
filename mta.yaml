_schema-version: 3.3.0
ID: odatano
version: 1.9.0
description: "A SAP CAP service for interacting with Cardano blockchain data."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds-typer "*" --outputDirectory @cds-models
        - npx tsc -p tsconfig.build.json
        - npx cds build --production
        - node scripts/build/gen-srv-package.js
modules:
  - name: odatano-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    properties:
      NETWORK: preview
      BACKENDS: blockfrost,koios
      BLOCKFROST_API_KEY: your_blockfrost_api_key_here
      TX_BUILDERS: buildooor
      HSM_ENABLED: false
    build-parameters:
      builder: custom
      commands:
        - npm install --production
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: odatano-auth
      - name: odatano-db
  - name: odatano
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: odatano-auth
      - name: odatano-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: odatano-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: odatano-auth
      - name: srv-api
      - name: odatano-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    build-parameters:
      build-result: app/
      requires:
        - name: odatanoviewwallet
          artifacts:
            - odatanoviewwallet.zip
          target-path: app/

  - name: odatanoviewwallet
    type: html5
    path: app/wallet
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms:
        []

  - name: odatano-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: odatano-db

resources:
  - name: odatano-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: odatano-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api

  - name: odatano-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: odatano-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: odatano-db
    type: com.sap.xs.hdi-container
